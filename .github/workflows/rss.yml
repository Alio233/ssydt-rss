name: Generate SSYDT RSS

on:
  # 1. 允许你手动在网页上点击按钮立即运行
  workflow_dispatch:
  # 2. 定时每天北京时间早上 8:00 自动运行一次 (UTC时间 0:00)
  schedule:
    - cron: '0 0 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 把仓库代码下载到虚拟机
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 配置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 安装脚本需要的依赖库
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      # 4. 运行 Python 脚本生成 xml 文件
      - name: Run script
        run: python generate_rss.py

      # 5. 把生成的 rss 文件自动提交并推送到仓库
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ssydt_rss.xml
          git commit -m "Auto-update RSS XML [skip ci]" || exit 0
          git push
